
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu App</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .container{
      text-align:center;
      background:#1e293b;
      padding:40px;
      border-radius:20px;
      width:90%;
      max-width:400px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    h1{
      margin-bottom:15px;
      font-size:32px;
    }

    p{
      margin-bottom:25px;
      color:#cbd5e1;
    }

    button{
      background:#3b82f6;
      border:none;
      padding:15px 25px;
      border-radius:10px;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#2563eb;
    }

    .resultado{
      margin-top:20px;
      font-size:20px;
      color:#22c55e;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Meu Primeiro App</h1>

    <p>Projeto funcionando no GitHub.</p>

    <button onclick="mostrarMensagem()">
      Clique Aqui
    </button>

    <div class="resultado" id="resultado"></div>
  </div>

  <script>
    function mostrarMensagem(){
      document.getElementById("resultado").innerHTML =
        "Seu app está funcionando!";
    }
  </script>

</body>
</html>
